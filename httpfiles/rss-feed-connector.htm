<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RSS Feed Connector</title>
    <link rel="stylesheet" href="rss-feed-connector.css">
    <script src="web1/lib1/innovaphone.lib1.js"></script>
    <script src="web1/appwebsocket/innovaphone.appwebsocket.Connection.js"></script>
    <script defer src="rss-feed-connector.js"></script>
</head>
<body>
    <main class="app">
        <header class="app-header">
            <div class="brand">
                <img class="brand-logo" src="rss-connect-logo.png" alt="Connect mit RSS">
                <div>
                    <p class="eyebrow">CONNECT · FEED-VERWALTUNG</p>
                    <h1>RSS Feed Connector</h1>
                    <p class="subtitle">Feeds verwalten und automatisch in Connect veröffentlichen.</p>
                </div>
            </div>
            <div id="connection-status" class="connection-status" role="status">Verbinde …</div>
        </header>

        <section class="identity-panel" aria-label="Plattform-Identität">
            <div>
                <span class="field-label">Angemeldet als</span>
                <strong id="identity-user">–</strong>
            </div>
            <div>
                <span class="field-label">myApps-App</span>
                <strong id="identity-app">–</strong>
            </div>
            <p>Domain und App-Identität werden von myApps bereitgestellt.</p>
        </section>

        <div id="notice" class="notice" role="status" hidden></div>

        <section class="panel">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">KONFIGURATION</p>
                    <h2 id="form-heading">Feed hinzufügen</h2>
                </div>
                <button id="cancel-edit" class="button button-quiet" type="button" hidden>Abbrechen</button>
            </div>
            <form id="feed-form">
                <input id="feed-id" type="hidden">
                <div class="form-grid">
                    <label>
                        Feed-Name
                        <input id="feed-name" name="name" type="text" maxlength="128" required placeholder="z. B. Heise Security">
                    </label>
                    <label>
                        Feed-URL
                        <input id="feed-url" name="url" type="url" maxlength="2048" required placeholder="https://example.com/feed.xml">
                    </label>
                    <label>
                        Connect-Zone / Topic
                        <select id="feed-topic" name="topic" required>
                            <option value="">Topics werden geladen …</option>
                        </select>
                    </label>
                    <label>
                        Tags
                        <input id="feed-tags" name="tags" type="text" placeholder="security, heise">
                        <span class="hint">Kommagetrennte Connect-Tags</span>
                    </label>
                    <label>
                        Abrufintervall (Minuten)
                        <input id="feed-interval" name="interval" type="number" min="1" max="1440" step="1" value="15" required>
                    </label>
                    <label class="checkbox-field">
                        <input id="feed-enabled" name="enabled" type="checkbox" checked>
                        <span>Feed aktiv</span>
                    </label>
                </div>
                <div class="form-actions">
                    <button id="save-feed" class="button button-primary" type="submit">Feed hinzufügen</button>
                </div>
            </form>
        </section>

        <section class="feeds-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">ÜBERSICHT</p>
                    <h2>Deine Feeds</h2>
                </div>
                <button id="refresh" class="button button-quiet" type="button">Aktualisieren</button>
            </div>
            <div id="feed-list" class="feed-list" aria-live="polite">
                <div class="empty-state">Lade Feed-Konfiguration …</div>
            </div>
        </section>
    </main>
</body>
</html>
