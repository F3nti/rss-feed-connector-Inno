<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 32 448 448" width="100%" height="100%">
  <defs>
    <!-- Background Tile: Innovaphone Signature Mint Teal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19B593"/>
      <stop offset="50%" stop-color="#14A483"/>
      <stop offset="100%" stop-color="#0F8E71"/>
    </linearGradient>

    <!-- Vibrant RSS Coral / Orange Gradient -->
    <linearGradient id="rssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF542E"/>
      <stop offset="50%" stop-color="#FF411C"/>
      <stop offset="100%" stop-color="#E02B09"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#053F32" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle Tile -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)"/>

  <!-- Shifted whole composition an additional 12px to the left (total shift of 26px)
       to balance visual weight and center perfectly within the tile. -->
  <g filter="url(#shadow)">

    <!-- 1. INNOVAPHONE CONNECT CHEVRON (Original 45-degree angled chevron, shifted further left) -->
    <path d="M 210,146
             L 126,230
             C 112,244 112,268 126,282
             L 210,366
             C 220,376 238,376 248,366
             L 266,348
             C 276,338 276,320 266,310
             L 210,256
             L 266,202
             C 276,192 276,174 266,164
             L 248,146
             C 238,136 220,136 210,146 Z"
          fill="#FFFFFF"/>

    <!-- 2. RSS BEACON DOT (White ring with orange center, shifted further left) -->
    <!-- Positioned to the right of the crook (X is now 244) -->
    <circle cx="244" cy="256" r="20" fill="#FFFFFF"/>
    <circle cx="244" cy="256" r="11" fill="url(#rssGrad)"/>

    <!-- 3. GRADIENT ORANGE RSS WAVES (Expanding rightward, shifted further left) -->
    <g fill="none" stroke="url(#rssGrad)" stroke-linecap="round">
      <!-- Wave 1 (Inner Arc: r = 60px) -->
      <path d="M 286,308 A 60,60 0 0,0 286,204" stroke-width="22"/>

      <!-- Wave 2 (Middle Arc: r = 98px) -->
      <path d="M 313,335 A 98,98 0 0,0 313,177" stroke-width="22"/>

      <!-- Wave 3 (Outer Arc: r = 136px) -->
      <path d="M 340,362 A 136,136 0 0,0 340,150" stroke-width="22"/>
    </g>

  </g>
</svg>
